<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMB追剧遥控</title><style>
:root{--ink:#12212b;--paper:#f4efe5;--red:#d74d32;--blue:#176b87;--line:#c9c0af}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#f7cfa6,transparent 38%),var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 18px 60px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:14px}h1{font-family:Georgia,serif;font-size:34px;margin:0}.live{color:var(--red);font-weight:800}.card{background:#fffdf7;border:1px solid var(--line);box-shadow:5px 5px 0 #d9cfbd;margin-top:20px;padding:18px}h2{margin:0 0 14px;font-size:20px}.title{font-size:18px;font-weight:800}.muted{color:#66747c;font-size:13px}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}button{border:0;background:var(--ink);color:white;border-radius:4px;padding:13px 8px;font-weight:700}button.accent{background:var(--red)}button.blue{background:var(--blue)}input,select{width:100%;padding:12px;border:1px solid var(--line);background:white;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center;border-top:1px solid #e4ddcf;padding:12px 0}.row:first-child{border:0}.row .grow{flex:1;min-width:0}.row button{padding:9px}.bar{height:6px;background:#ddd;margin-top:14px}.bar i{display:block;height:100%;background:var(--red);width:0}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;display:none}@media(max-width:520px){.controls{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main class="wrap"><header><div><div class="muted">局域网控制台</div><h1>SMB追剧</h1></div><div class="live" id="online">连接中</div></header>
<section class="card"><h2>正在播放</h2><div class="title" id="title">未播放</div><div class="muted" id="pstatus"></div><div class="bar"><i id="progress"></i></div><div class="controls"><button onclick="act('previous')">上一个</button><button onclick="act('seek',{offset:-10000})">-10秒</button><button class="accent" onclick="act('toggle')">播放/暂停</button><button onclick="act('seek',{offset:10000})">+10秒</button><button onclick="act('next')">下一个</button></div><div style="margin-top:10px"><select onchange="act('speed',{speed:+this.value})"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></div></section>
<section class="card"><h2>播放列表</h2><div id="playlists"></div><button class="blue" onclick="clean()">清理失效列表</button></section>
<section class="card"><h2>SMB 管理</h2><div class="grid"><input id="host" placeholder="IP，如 192.168.0.100"><input id="share" placeholder="共享名，如 media"><input id="user" placeholder="用户名"><input id="password" type="password" placeholder="密码"></div><div class="controls" style="grid-template-columns:1fr 1fr"><button onclick="smbTest()">测试连接</button><button class="accent" onclick="smbAdd()">添加并扫描</button></div><div id="connections" style="margin-top:12px"></div></section></main><div class="status" id="toast"></div><script>
const token=location.hash.slice(1),enc=new TextEncoder(),dec=new TextDecoder();let key,pairingId;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function init(){if(!token){say('配对信息无效');return}const hash=await crypto.subtle.digest('SHA-256',enc.encode(token));key=await crypto.subtle.importKey('raw',hash,'AES-GCM',false,['encrypt']);pairingId=hex(hash);await refresh();setInterval(refresh,1500)}
async function api(path,data){let opt={headers:{'X-Pairing-Id':pairingId}};if(data){const iv=crypto.getRandomValues(new Uint8Array(12)),raw=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({iv:b64(iv),data:b64(raw)})}const r=await fetch(path,opt),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'请求失败');return j}
async function refresh(){try{const s=await api('/api/state');online.textContent='已连接';const p=s.player||{};title.textContent=p.title||'未播放';pstatus.textContent=p.status||'';progress.style.width=(p.duration?Math.min(100,p.position/p.duration*100):0)+'%';playlists.innerHTML=(s.playlists||[]).map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.last||x.directory)}</div></div><button onclick='play(${JSON.stringify(x.directory)})'>播放</button></div>`).join('')||'<div class="muted">暂无播放列表</div>';connections.innerHTML=(s.connections||[]).map(x=>`<div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="muted">${esc(x.url)}</div></div><button onclick='scan(${JSON.stringify(x.url)})'>扫描</button><button onclick='del(${JSON.stringify(x.url)})'>删除</button></div>`).join('')}catch(e){online.textContent='已断开'}}
const form=()=>({host:host.value,share:share.value,username:user.value,password:password.value});async function act(action,x={}){try{await api('/api/action',{action,...x})}catch(e){say(e.message)}}async function play(directory){try{await api('/api/play',{directory});say('已在电视开始播放')}catch(e){say(e.message)}}async function smbTest(){try{await api('/api/smb/test',form());say('连接成功')}catch(e){say(e.message)}}async function smbAdd(){try{let r=await api('/api/smb/add',form());password.value='';say(`已生成 ${r.count} 个播放列表`);refresh()}catch(e){say(e.message)}}async function scan(url){try{let r=await api('/api/smb/scan',{url});say(`扫描完成：${r.count}`);refresh()}catch(e){say(e.message)}}async function del(url){if(!confirm('删除该连接？'))return;try{await api('/api/smb/delete',{url});refresh()}catch(e){say(e.message)}}async function clean(){try{let r=await api('/api/clean',{});say(`清理 ${r.removed} 个，${r.unknown} 个未确认`);refresh()}catch(e){say(e.message)}}function say(x){toast.textContent=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',2500)}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
