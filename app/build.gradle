plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def versionProperties = new Properties()
def versionPropertiesFile = rootProject.file('version.properties')
if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}
def buildNumber = (project.findProperty('buildNumber')
        ?: versionProperties.getProperty('BUILD_NUMBER', '0')).toInteger()
def displayVersion = project.findProperty('releaseVersion')
        ?: String.format(Locale.ROOT, '1.3.%03d', buildNumber)
def numericVersionCode = project.findProperty('releaseVersionCode')
        ? project.property('releaseVersionCode').toInteger()
        : 1003000 + buildNumber

android {
    namespace 'com.smbwatch.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smbwatch.tv'
        minSdk 21
        targetSdk 35
        versionCode numericVersionCode
        versionName displayVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stable {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.stable
            }
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "smb-watch-tv-${variant.versionName}-${variant.buildType.name}.apk"
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-ui:1.7.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    // JVM 单元测试使用真实的 org.json 实现（android.jar 中只有桩）
    testImplementation 'org.json:json:20240303'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
