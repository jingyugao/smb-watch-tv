plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.smbwatch.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.smbwatch.tv'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stable {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.stable
            }
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "smb-watch-tv-${variant.versionName}-${variant.buildType.name}.apk"
    }
}

dependencies {
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.security:security-crypto:1.1.0'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
