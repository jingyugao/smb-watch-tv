name: Release APK

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
          {
            echo 'storeFile=.signing/release.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          base=$((10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100))
          if [[ "$version" == *-* ]]; then
            suffix="${version#*-}"
            sequence="${suffix##*.}"
            [[ "$sequence" =~ ^[0-9]+$ ]] || sequence=1
            code=$((base + 10#$sequence))
            prerelease=true
          else
            code=$((base + 99))
            prerelease=false
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: gradle testReleaseUnitTest
      - name: Build signed release APK
        run: >-
          gradle
          -PreleaseVersion=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}
          assembleRelease
      - name: Create checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > smb-watch-tv-${{ steps.version.outputs.name }}.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          apk=(app/build/outputs/apk/release/*.apk)
          checksum="app/build/outputs/apk/release/smb-watch-tv-${{ steps.version.outputs.name }}.sha256"
          args=(release create "$GITHUB_REF_NAME" "${apk[0]}" "$checksum" --title "$GITHUB_REF_NAME" --generate-notes)
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh "${args[@]}"
      - name: Mirror release assets to Gitee
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_OWNER: ggyy00
          GITEE_REPO: smb-watch-tv
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARTIFACT_DIR: app/build/outputs/apk/release
        run: scripts/publish-gitee-update.sh
